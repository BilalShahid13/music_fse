name: music_fse
description: Full Screen Experience music player for handheld gaming PCs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Audio
  just_audio: ^0.9.39
  just_audio_windows: ^0.2.3

  # Database
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Navigation
  go_router: ^17.2.1

  # Window management
  window_manager: ^0.5.1

  # File system & paths
  path_provider: ^2.1.5
  path: ^1.9.1

  # Localization
  intl: ^0.20.2

  # Metadata
  metadata_god: ^1.1.0
  image: ^4.8.0

  # UI
  google_fonts: ^8.0.2
  lucide_icons_flutter: ^3.1.13
  desktop_drop: ^0.7.1
  reorderables: ^0.6.0

  # Data modeling
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Platform / FFI
  ffi: ^2.2.0
  win32: ^5.9.0
  smtc_windows: ^1.1.0
  system_tray: ^2.0.3

  # Utilities
  collection: ^1.19.1
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3
  riverpod: ^3.2.1
  freezed: ^3.2.5
  json_serializable: ">=6.13.0 <6.13.1"
  drift_dev: ^2.31.0
  mocktail: ^1.0.3

dependency_overrides:
  freezed_annotation: ^3.1.0
  flutter_rust_bridge: 2.11.1
  uuid: ^4.5.1

flutter:
  uses-material-design: false
  generate: true

  assets:
    - assets/branding/icon/
    - assets/branding/launcher/
    - assets/fonts/
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
